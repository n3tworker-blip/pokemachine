<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PokeMachine — Trunk or Treat Prize Machine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="scroll-bg" aria-hidden="true"></div>
    <div id="confetti-layer" aria-hidden="true"></div>

    <header id="idle-screen" class="screen">
      <div class="content-panel">
        <h1 class="title" id="title">PokéMachine</h1>
        <p class="subtitle">Sunset Heights Trunk or Treat</p>
        <button id="prize-button" class="pokeball-button" aria-label="Tap to win a prize">
          <span class="pokeball" id="pokeball"></span>
        </button>
      </div>
    </header>

    <section id="reveal-screen" class="screen hidden">
      <div class="reveal-card content-panel">
        <div class="reveal-image-wrap">
          <img id="reveal-image" src="" alt="" hidden>
          <div id="reveal-placeholder" class="reveal-placeholder"></div>
        </div>
        <h2 id="reveal-name" class="reveal-name"></h2>
        <button id="reset-button" class="reset-button">Tap for Next Prize</button>
      </div>
    </section>

    <!-- Staff-only: press and hold the title for a few seconds to open. -->
    <section id="admin-screen" class="screen hidden">
      <div class="content-panel admin-panel">
        <h2 class="admin-heading">Inventory &amp; Stats</h2>
        <dl id="admin-stats" class="admin-stats"></dl>
        <table class="admin-table">
          <thead>
            <tr><th>Prize</th><th>Given</th><th>Left</th><th>Chance now</th></tr>
          </thead>
          <tbody id="admin-rows"></tbody>
        </table>
        <div class="admin-actions">
          <button id="admin-close" class="reset-button">Close</button>
          <button id="admin-reset" class="reset-button danger">Reset Counts</button>
        </div>
        <div id="admin-reset-confirm" class="admin-reset-confirm" hidden>
          <p>Are you sure? This sets every prize count and all tap stats on this device back to zero. It can't be undone.</p>
          <div class="admin-actions">
            <button id="admin-reset-cancel" class="reset-button">No, keep counts</button>
            <button id="admin-reset-yes" class="reset-button danger">Yes, reset to zero</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/prizes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
